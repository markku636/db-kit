[package]
name = "db-kit"
version = "0.57.1"
description = "Unified database management tool"
license = "MIT"
edition = "2021"
rust-version = "1.77"
# 本 crate 有兩個 binary（GUI: db-kit / CLI: dbk）。明確指定 GUI 為預設主程式，
# 否則 `tauri build` 在多 binary 間會選錯（曾誤打包成 CLI dbk.exe，安裝後雙擊只閃 CLI 即關）。
default-run = "db-kit"

[lib]
name = "db_kit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# GUI 桌面程式（Tauri）。slim CLI build（--no-default-features）會略過此 bin。
[[bin]]
name = "db-kit"
path = "src/main.rs"
required-features = ["gui"]

# 命令列工具（唯讀查詢 + 匯出）。不需 gui feature，--no-default-features 也能單獨編譯。
[[bin]]
name = "dbk"
path = "src/bin/dbk.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 改為 optional：藏在預設 `gui` feature 後，讓 CLI 能 --no-default-features 編出不連 Tauri 的精簡 binary。
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
# preserve_order：保留 JSON 物件鍵序（IndexMap）。否則 serde_json 預設 BTreeMap 會把鍵按字母排序，
# 導致 MongoDB 多欄 sort（如 {"name":1,"age":-1}）被重排、排序優先序錯誤；JSON 匯出欄序也會亂。
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
# tls-rustls-ring-native-roots：MySQL/PG 的 ssl-mode 支援（rustls + ring，延續全案避開 OpenSSL/NASM 的原則；
# 不可換 tls-rustls-aws-lc-rs——會拉進 aws-lc-sys 需要 NASM）。
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "postgres", "sqlite", "chrono", "uuid", "bigdecimal", "json", "tls-rustls-ring-native-roots"] }
mongodb = "3"
# MSSQL：sqlx 0.8 已移除 MSSQL 支援，改用純 Rust TDS 驅動 tiberius + bb8 連線池。
# rustls 而非 native-tls：延續 russh 的 ring 決定，避開 OpenSSL 系統相依（Windows 免 NASM）。
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
bb8 = "0.8"
bb8-tiberius = "0.15"
# tiberius 走 futures-io，需 tokio-util 的 compat 轉接到 tokio。
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
# Oracle：rust-oracle（ODPI-C）。編譯僅需 C compiler（ODPI-C 原始碼隨 crate 以 cc 編譯，MSVC 已是 Tauri 必備）；
# Oracle Instant Client 於「執行期」LoadLibrary 載入——不裝 client 也能編譯 / 啟動，只有連 Oracle 時才需要。
# 這是全案唯一需要原生 DLL 的例外（rustls/ring 免系統相依原則不受影響）；不隨附 DLL，連線時偵測既有安裝。
oracle = { version = "0.6", features = ["chrono"] }
# connection-manager：多工單連線 + 斷線自動重連，供 per-db-index 連線快取（避免每次操作新建 TCP）。
# tokio-rustls-comp：rediss:// TLS（用 rustls/ring，延續 russh 決定，避開 OpenSSL 系統相依）。
# tls-rustls-insecure：讓 rediss://host:port/db#insecure fragment 生效（自簽憑證 / 內網）。
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-insecure"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
parking_lot = "0.12"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
# CLI 參數解析（derive 指令樹；env 讓 --password 可吃環境變數 DBKIT_PASSWORD）。CLI 必備，不放在 gui feature 後。
clap = { version = "4", features = ["derive", "env"] }
# SSH Tunnel：純 Rust。用 ring 當 crypto backend（避免 aws-lc-sys 需要 NASM 才能在 Windows 編譯）。
# 0.62：與 IronRDP（經 vendor/ironrdp-connector 升到 picky rc.26）共用同一套正式版 RustCrypto（見檔尾 [patch]）。
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
# SFTP 子系統（SSH 終端機分頁的檔案瀏覽 / 上下傳）：純 Rust、與 russh 版本無耦合，套在 russh channel 的
# `into_stream()` 上即可。核心層即用（`ssh/sftp.rs` 不依賴 Tauri），故不藏在 gui feature 後。
russh-sftp = { version = "3.0", default-features = false }
# FTP / FTPS（檔案面板的 FTP 主機；斷點續傳用 REST / APPE）：tokio + rustls/ring，延續全案避開 OpenSSL、aws-lc 的原則。
# `deprecated`：implicit FTPS（990 埠一連上就走 TLS）在 suppaftp 藏在這個 feature 後面。
suppaftp = { version = "12.1", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
# FTPS 的 TLS 設定：信任根 = OS 憑證庫（rustls-native-certs），不在信任鏈上的（自簽 / 內網）以憑證 SHA-256
# 指紋 TOFU，記在 known_hosts。版本對齊 suppaftp 用的 tokio-rustls 0.26（rustls 0.23，ring）。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
# 舊式 OpenSSL 加密的 PEM 私鑰（Proc-Type: 4,ENCRYPTED；openssl genrsa -des3 之類）：russh 只解 AES-128，
# 3DES / DES / AES-192/256-CBC 與 EVP_BytesToKey(MD5) 在 ssh/keys.rs 補。版本對齊依賴樹裡既有的
# （aes-gcm 0.10 → aes 0.8 / cipher 0.4），不另外多拉一套。
aes = "0.8"
cbc = "0.1"
des = "0.8"
md-5 = "0.10"
# ssh-key 0.7（russh 帶的）用 rand_core 0.10：產生金鑰、金鑰庫重新加密要一顆同代的 RNG。與下面的 rand 0.8 並存。
rand010 = { package = "rand", version = "0.10" }
# russh `ChannelMsg::Data` 的 payload 型別；終端機讀端測試要能自己組 `ChannelMsg`，且 `data_bytes` 吃 `Into<Bytes>`。
# 交給 IPC channel 的是 `Vec<u8>`（`InvokeResponseBody::Raw` 只收 Vec），合併緩衝直接 `mem::take` 零複製。
bytes = "1"
# 取 OS 設定目錄（SSH known-hosts 指紋存放位置；CLI 亦以此推導與 GUI 相同的設定目錄）。
dirs = "6"
# 連線設定加密匯出 / 匯入（含密碼；passphrase 經 Argon2 派生金鑰 + AES-256-GCM）。
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
# 遠端桌面 RDP：IronRDP（純 Rust，MIT/Apache）逐 crate 挑用。**絕不**開 ironrdp 的 `client*` / `rustls`
# 或 ironrdp-tls 的 `rustls`——那些都指向 aws-lc-rs（要 NASM）；TLS 走 `rustls-ring`，延續全案 ring 決定。
# ironrdp-tokio 不開 `reqwest`（Kerberos KDC 用；NLA 只做 NTLM）。藏在 `rdp` feature 後（隨 default 開）。
ironrdp = { version = "0.17", default-features = false, optional = true, features = [
  "core", "pdu", "connector", "session", "graphics", "input", "svc", "dvc", "displaycontrol", "cliprdr",
] }
ironrdp-tokio = { version = "0.10", default-features = false, optional = true }
ironrdp-tls = { version = "0.2.2", default-features = false, features = ["rustls-ring"], optional = true }
# RDP 伺服器憑證（TOFU 指紋）：`ironrdp_tls::upgrade` 回傳的型別；版本對齊 ironrdp-tls。
x509-cert = { version = "0.2", default-features = false, features = ["std"], optional = true }
# 啟動時把 ring 裝成 rustls 的程序預設 provider（保險：依賴樹裡只有 ring，但別讓 `builder()` 靠運氣）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
# 遠端桌面的剪貼簿同步：由後端讀寫系統剪貼簿（webview 的 navigator.clipboard.readText 會跳權限詢問、搶走焦點）。
# 純 Rust（Windows 走 clipboard-win、macOS 走 objc2、Linux 走 x11rb）。只有 GUI 用，藏在 gui feature 後。
arboard = { version = "3", default-features = false, optional = true }
# 遠端桌面 VNC：macOS 螢幕共享的 ARD 認證（Diffie-Hellman）要大數運算；其餘（DES / AES / MD5）沿用上面既有的 crate。
num-bigint = { version = "0.4", optional = true }
# VNC 的 VeNCrypt 匿名 TLS（rd/vnc/tls_anon.rs，自己實作的 TLS 1.2 ECDH_anon）：X25519 金鑰交換、HMAC（PRF 與紀錄層 MAC）。
# 兩個都已在依賴樹裡（russh / RustCrypto），不會多下載。X509 子型別走上面的 rustls（ring）。
curve25519-dalek = { version = "5", optional = true }
hmac = { version = "0.12", optional = true }
# RDP fast-path 事件容器（ironrdp-input 的回傳型別）。
smallvec = { version = "1", optional = true }
# Excel (.xlsx) 匯出：純 Rust（內含 zip + miniz_oxide，無 C / 系統相依），跨平台可打包。
rust_xlsxwriter = "0.79"
# Excel (.xlsx/.xls) 匯入讀取：純 Rust，dates 特性讓日期欄解析為日期而非序號。
calamine = { version = "0.26", features = ["dates"] }
# Kafka：rdkafka（綁定 librdkafka C）。Windows 只支援 cmake-build（vendors librdkafka 原始碼、靜態連結，
# 需 CMake + MSVC；本機 VS BuildTools 已具備）。藏在 `kafka` feature 後（隨 gui 預設開）：slim CLI
# （--no-default-features）不受 librdkafka 建置負擔影響。ssl（TLS / SASL_SSL）待 P7 併同預建 OpenSSL 開啟
# （見 features.kafka-tls）；此處先支援 PLAINTEXT / SASL_PLAINTEXT（SCRAM/PLAIN 內建於 librdkafka，免 OpenSSL）。
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build", "tokio"], optional = true }
# Schema Registry：以 reqwest（rustls，延續全案避開 OpenSSL/NASM）打 Confluent SR REST API，
# apache-avro（純 Rust）依 schema id 解 Avro binary → JSON。皆藏在 `kafka` feature 後。
# rustls-tls-native-roots：改用 OS 憑證庫當信任根（讓企業內部 CA 免手動指定 CA 檔）；
# 同時惠及 Kafka Schema Registry / Connect 與 Elasticsearch REST client。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"], optional = true }
# base64：Elasticsearch 的 API key（base64(id:key)）與 Elastic Cloud ID 解碼共用。
# 刻意**不**藏在 elastic feature 後：Cloud ID 的解碼住在 db/conn_url（連線字串解析的統一落點，
# 沒有 feature gate，精簡 CLI 也依賴它）。純 Rust 無相依的小 crate，精簡版多連它不痛。
base64 = "0.22"
apache-avro = { version = "0.17", optional = true }
# Kubernetes：kubeconfig 讀取與資源 YAML 往返（檢視 / 編輯 / 套用）。純 Rust（unsafe-libyaml 是 libyaml 的 Rust 轉譯，無 C 編譯）。
# sha1：exec / port-forward 的 WebSocket 交握驗證 Sec-WebSocket-Accept（依賴樹裡本來就有 0.10）。皆藏在 docker feature 後。
serde_yaml = { version = "0.9", optional = true }
sha1 = { version = "0.10", optional = true }
# Protobuf 動態解碼：protox 由 .proto 文字編出 FileDescriptorSet，prost-reflect 依 descriptor
# 動態解 protobuf binary → JSON。皆純 Rust，藏在 kafka feature 後。
protox = { version = "0.9", optional = true }
prost-reflect = { version = "0.16", features = ["serde"], optional = true }
prost = { version = "0.14", optional = true }
# 訊息 JS 篩選運算式（Conduktor 風）：純 Rust JS 引擎，藏在 kafka-js feature 後。
# 編譯較重（+2~4 分鐘、二進位 +4~8MB），故獨立成 feature 讓開發/CI 可關。
boa_engine = { version = "0.20", optional = true }
# RabbitMQ：lapin（純 Rust AMQP 0-9-1）。default-features=false + 明確選 rustls--ring：
# rustls--ring 鎖定 ring 為 rustls 的 crypto provider，避開 aws-lc-sys（需 NASM，Windows 打包地雷），
# 延續全案 ring 決定。tokio feature 讓 lapin 走 tokio reactor/executor（與本 app runtime 一致）。
# rustls-native-certs：以 OS 憑證庫為信任根（amqps 企業內部 CA 免手動指定）。藏在 `rabbitmq` feature 後。
# 注意：lapin 4.10 宣告 rust-version 1.88（本機 toolchain 1.96 可編）；Management REST 走既有 reqwest。
lapin = { version = "4.10", default-features = false, features = ["tokio", "rustls-native-certs", "rustls--ring"], optional = true }

# OS keychain：依平台選用原生後端，避免在 Windows 上編譯 secret-service。
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# 生物辨識解鎖（Windows Hello：指紋 / 臉 / PIN）。版本刻意對齊 Tauri 2.11 用的 windows 0.61，
# 讓 WebviewWindow::hwnd() 回傳的 HWND 型別直接通用，也不會在依賴圖上多編一份 windows crate。
# Win32_System_WinRT 是關鍵 feature —— IUserConsentVerifierInterop 藏在那底下；少了它就只剩
# 無視窗版的 RequestVerificationAsync，而那個在非 UWP 的 Win32 程式上叫不起來。
# optional：藏在 gui feature 後，slim CLI（--no-default-features）不必編 WinRT 綁定。
windows = { version = "0.61", optional = true, features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_System_WinRT",
  "Win32_Foundation",
  "Win32_System_Com",
  # 遠端桌面全螢幕時攔 Win / Alt+Tab / Alt+F4 / Ctrl+Esc（WH_KEYBOARD_LL，見 rd/keygrab.rs）。
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
] }
# IAsyncOperation。windows 0.61 配 windows-future 0.2（阻塞取值是 .get()；0.3 才改名 .join()）。
windows-future = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# 生物辨識解鎖（Touch ID）：LocalAuthentication framework。objc2 家族一級 crate，
# 純綁定不需 Swift toolchain（apple-localauthentication 那條路會在 build.rs 呼叫 swift build）。
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", optional = true, features = [
  "LAContext",
  "LAError",
  "LABiometryType",
  "block2",
] }
block2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[features]
default = ["gui", "kafka", "kafka-js", "elastic", "rabbitmq", "docker", "remote-desktop"]
# gui：啟用 Tauri 桌面程式（commands / agent / scheduler / run()）。預設開啟。
# 生物辨識解鎖的平台綁定一併掛在此：兩組 dep 都宣告在 per-target 區塊內，
# 於非該平台編譯時 Cargo 直接忽略，不需要再寫一層 cfg。
gui = [
  "dep:tauri",
  "dep:arboard",
  # AI 助手的 HTTP 供應商（Anthropic / OpenAI 相容）需要 reqwest；slim CLI 不含 AI，故掛在 gui 後。
  "dep:reqwest",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-notification",
  "dep:windows",
  "dep:windows-future",
  "dep:objc2",
  "dep:objc2-foundation",
  "dep:objc2-local-authentication",
  "dep:block2",
]
custom-protocol = ["gui", "tauri/custom-protocol"]
# kafka：一等公民 Kafka 支援（rdkafka / librdkafka）。隨 gui 預設開啟，讓開源桌面版內建此功能；
# slim CLI（dbk）以 --no-default-features 排除，免除 CMake / C toolchain 建置負擔。
kafka = ["dep:rdkafka", "dep:reqwest", "dep:apache-avro", "dep:protox", "dep:prost-reflect", "dep:prost"]
# kafka-js：在 kafka 之上加內嵌 boa JS 引擎，供訊息 JS 篩選運算式。隨 default 開，可關以加速編譯。
kafka-js = ["kafka", "dep:boa_engine"]
# kafka-tls：在 kafka 之上額外開啟 rdkafka 的 ssl（TLS / SASL_SSL）。需預建 OpenSSL（見 P7 建置文件）。
# 分離成獨立 feature：無 OpenSSL 的開發環境仍可用 kafka（PLAINTEXT / SASL_PLAINTEXT）建置與測試。
kafka-tls = ["kafka", "rdkafka/ssl"]
# elastic：一等公民 Elasticsearch / OpenSearch 支援（REST；以 reqwest rustls 接入，純 Rust 無 C 相依）。
# 隨 gui 預設開啟；slim CLI（--no-default-features）排除。第一版唯讀瀏覽 + DSL 查詢。
elastic = ["dep:reqwest"]
# rabbitmq：一等公民 RabbitMQ 支援。AMQP 0-9-1 走 lapin（peek/publish/delete）、Management REST（15672）
# 走既有 reqwest（overview/queues/exchanges/purge）。lapin 以 rustls--ring 鎖 provider，純 Rust 無 NASM 相依。
# 隨 gui 預設開啟；slim CLI（--no-default-features）排除。
rabbitmq = ["dep:lapin", "dep:reqwest"]
# docker：容器與映像管理（Docker Engine API / Docker Registry v2 / Harbor）。全走既有 reqwest：
# 本機 unix socket / Windows named pipe、TCP、TLS（含用戶端憑證 mTLS）皆由 reqwest 內建支援，
# 不引入 bollard（其 ssl feature 會拉進 aws-lc / NASM）。隨 gui 預設開啟；slim CLI（--no-default-features）排除。
# Kubernetes 也掛在這裡（同屬「容器」類、同一個 ContainerDriver）：一樣走 reqwest，exec / port-forward 的
# WebSocket 在 reqwest 的 upgrade 連線上自己收發幀，不引入 kube-rs / tungstenite。
docker = ["dep:reqwest", "dep:serde_yaml", "dep:sha1"]
# remote-desktop：分頁內嵌的 RDP（IronRDP）與 VNC（前端 noVNC，後端代做 RFB 認證）。純 Rust、無 NASM 相依
# （winscard 會以 cc 編 bundled zlib，MinGW gcc 即可）。隨 default 開；slim CLI 排除。
rdp = ["dep:ironrdp", "dep:ironrdp-tokio", "dep:ironrdp-tls", "dep:x509-cert", "dep:rustls", "dep:smallvec"]
vnc = ["dep:num-bigint", "dep:curve25519-dalek", "dep:hmac", "dep:sha1", "dep:rustls", "dep:x509-cert"]
remote-desktop = ["rdp", "vnc"]

# Release 瘦身（保守版）：
# - lto="thin"：跨 codegen unit 最佳化但平行執行，連結期記憶體峰值遠低於 fat LTO
#   （本機 rustc/LLVM 有 OOM 前科，不用 lto=true；OOM 時退回移除此行）。
# - strip="symbols"：去 symbol table；MSVC 的 debug info 本在 .pdb，對其他平台亦通用。
# - codegen-units 維持預設 16（=1 收益再 +2~4% 但單 module 記憶體最高，不冒險）。
[profile.release]
lto = "thin"
strip = "symbols"

# ironrdp-connector 0.10.0 原樣（MIT / Apache-2.0，© Devolutions）只改依賴：picky =7.0.0-rc.25 → rc.26、sspi 0.21 → 0.22。
# rc.25 把 RustCrypto 一整串（ecdsa / curve25519-dalek / p256…）釘在預發布版，跟 russh 0.62（正式版）在同一個
# semver 相容區間撞車、Cargo 無法並存；rc.26 起改用正式版。上游（IronRDP master）也還釘 rc.25，等它升級就拿掉。
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
