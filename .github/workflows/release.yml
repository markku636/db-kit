name: release

# 推送 v 開頭的版本標籤（例：v0.1.4）時，自動打包 Windows + Linux 安裝檔並建立 GitHub Release。
# 用法：
#   git tag v0.1.4
#   git push origin v0.1.4
# 也可在 Actions 頁面手動觸發（workflow_dispatch）：分支只建置並上傳產物，版本標籤才發佈。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # 建立 Release / 上傳安裝檔需要

jobs:
  build:
    strategy:
      fail-fast: false   # 一個平台失敗不影響另一個平台繼續打包
      matrix:
        include:
          # macOS Apple Silicon（M 系列）：產出 aarch64 的 .dmg / .app（未簽章）
          - platform: macos-latest
            label: macos-arm
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # macOS Intel：產出 x86_64 的 .dmg / .app（未簽章）。
          # macos-13（最後一代 Intel runner image）已退役，job 會永遠排不到機器（整條 run 卡 queued）；
          # 改在 Apple Silicon runner 上 rustup 加 x86_64 target 交叉編譯。
          - platform: macos-latest
            label: macos-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # Windows：產出 .msi 與 .exe(NSIS)
          - platform: windows-latest
            label: windows
            target: ""
            args: ""
          # Linux：產出 .deb / .rpm / .AppImage（用 22.04 以較舊 glibc 換取 AppImage 更廣的相容性）。
          # tauri.linux-updater.conf.json 把更新小幫手與它的 polkit 規則打包進 .deb / .rpm（見下面的 Build Linux updater）。
          - platform: ubuntu-22.04
            label: linux
            target: ""
            args: "--config src-tauri/tauri.linux-updater.conf.json"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Linux 系統依賴（Tauri v2 需 webkit2gtk-4.1；AppImage 需 patchelf；
      #     rdkafka-sys 的 cmake-build 從原始碼編 librdkafka 2.12，預設開 curl（OIDC token 端點）
      #     需要 libcurl 開發標頭，缺了會 fatal error: curl/curl.h: No such file or directory）---
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libayatana-appindicator3-dev

      # Node 24（內建 npm 11）：package-lock.json 由本機 npm 11 產生，npm 10（Node 20 內建）
      # 對 optional peerDependencies 的 `npm ci` 驗證不相容（Missing: esbuild@0.28.x from lock file，
      # 來自 vitest → vite 7 的 optional peer），Node 20 時全平台在 Install frontend deps 掛掉。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # macOS 需明確加上對應架構的 Rust target 才能交叉編譯 Intel / Apple Silicon
      - name: Add Rust target (macOS)
        if: ${{ matrix.target != '' }}
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            rustdesk-bridge
            linux-updater

      # RustDesk 相容連線的輔助程式（rustdesk-bridge/，AGPL-3.0，獨立程式）：先依 target 編好，
      # 放到 Tauri externalBin 要的位置（binaries/<名稱>-<target triple>[.exe]），下面 tauri build
      # 帶 --config src-tauri/tauri.bridge.conf.json 才會把它打包進去。只在這裡合併這份設定：
      # 平常開發（tauri dev / cargo check）不必先編它。
      - name: Build RustDesk bridge (AGPL sidecar)
        shell: bash
        run: |
          TRIPLE="${{ matrix.target }}"
          if [ -z "$TRIPLE" ]; then TRIPLE=$(rustc -vV | sed -n 's/^host: //p'); fi
          cargo build --release --manifest-path rustdesk-bridge/Cargo.toml --target "$TRIPLE"
          EXT=""
          case "$TRIPLE" in *windows*) EXT=".exe";; esac
          mkdir -p src-tauri/binaries
          cp "rustdesk-bridge/target/$TRIPLE/release/dbk-rustdesk-bridge$EXT" "src-tauri/binaries/dbk-rustdesk-bridge-$TRIPLE$EXT"

      # .deb / .rpm 的更新小幫手（linux-updater/）：App 經 pkexec 叫它以 root 安裝更新的正式版，polkit 規則讓
      # 坐在電腦前的使用者不用輸入密碼。tauri.linux-updater.conf.json 把它裝到 /usr/lib/db-kit/db-kit-updater
      # （.deb / .rpm 會照這裡的檔案權限打包，所以明確設成 755）。
      - name: Build Linux updater
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cargo build --release --manifest-path linux-updater/Cargo.toml
          mkdir -p src-tauri/binaries
          install -m 755 linux-updater/target/release/db-kit-updater src-tauri/binaries/db-kit-updater

      - name: Install frontend deps
        run: npm ci

      # Windows 免安裝版要內附的 Oracle 連線元件。排在 tauri build 之前：下載或校驗失敗時
      # 立刻停，不要等整包編完才發現。
      # 釘「固定版本」而非 latest 連結：latest 的內容會隨 Oracle 改版替換，校驗碼跟著失效，
      # 使用者每次拿到的也不一樣。換版時 URL、下面的 sha256 與
      # packaging/portable/ORACLE-NOTICE.txt 裡的版本與校驗碼要一起改。
      - name: Cache Oracle Instant Client
        if: matrix.platform == 'windows-latest'
        id: instantclient
        uses: actions/cache@v4
        with:
          path: instantclient.zip
          key: instantclient-basic-windows-x64-23.9.0.25.07

      - name: Download Oracle Instant Client
        if: ${{ matrix.platform == 'windows-latest' && steps.instantclient.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          curl -fsSL --retry 3 -o instantclient.zip \
            "https://download.oracle.com/otn_software/nt/instantclient/2390000/instantclient-basic-windows.x64-23.9.0.25.07.zip"

      - name: Verify Oracle Instant Client checksum
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "8ff61b58e810c91b0c340559aabe8b057f0a308ad80c94aba57920ca4a6e1736 *instantclient.zip" | sha256sum -c -

      # Release 說明取自 CHANGELOG 中該版本的段落（+ 下載指引）。原本是寫死的一句
      # 「見 CHANGELOG.md」，每個版本的 Release 頁面長得一模一樣，使用者得自己翻 commit
      # 才知道改了什麼。多行內容用 heredoc 分隔符寫進 GITHUB_ENV；bash 在三個平台的 runner
      # 上都有（Windows 走 Git Bash）。四個 matrix job 都會算一次，內容相同，
      # tauri-action 建立 / 更新的是同一個 Release，不會互相蓋掉。
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          {
            echo 'RELEASE_NOTES<<DBKIT_NOTES_EOF'
            node scripts/changelog-section.mjs "${{ github.ref_name }}"
            echo 'DBKIT_NOTES_EOF'
          } >> "$GITHUB_ENV"

      # tauri-action 會跑 beforeBuildCommand（npm run build）→ tauri build，
      # 然後依 tagName 建立 / 更新同一個 Release 並上傳該平台的安裝檔
      # （Windows: .msi/.exe；macOS: .dmg；Linux: .deb/.rpm/.AppImage）。
      # macOS 透過 matrix.args 指定 --target 交叉編出 Intel / Apple Silicon 兩版。
      - name: Build packages (publish only for version tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "db-kit ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.bridge.conf.json

      # --- Windows 免安裝版（zip）------------------------------------------------------
      # Tauri 的 Windows bundler 只有 msi / nsis，沒有免安裝 target，所以這包自己組：前端
      # 資源已嵌進執行檔，把 GUI、CLI、遠端桌面輔助程式與 Oracle 連線元件放同一層就能解壓即用
      # （找 sidecar 與 Oracle client 都是以「執行檔所在目錄」為基準，見 rd/rustdesk.rs
      # 的 bridge_path、agent.rs 的 resolve_dbk_bin、db/oracle.rs 的 probe_bundled_client）。
      # zip 內的 portable.txt 讓設定改寫同目錄的 data\ 而不是 %APPDATA%（store.rs 的 resolve_data_dir）。
      - name: Assemble portable zip
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          # tauri build 不指定 --bin，CLI 通常已一併編出；沒有才補編（features 與上一步一致，避免整包重編）。
          test -f src-tauri/target/release/dbk.exe \
            || cargo build --release --manifest-path src-tauri/Cargo.toml --bin dbk --features tauri/custom-protocol
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          triple=$(rustc -vV | sed -n 's/^host: //p')
          pkg="db-kit_${ver}_x64_portable"
          mkdir -p "$pkg/oracle"
          cp src-tauri/target/release/db-kit.exe "$pkg/"
          cp src-tauri/target/release/dbk.exe "$pkg/"
          # VC++ runtime 的 app-local 副本：Rust 的 MSVC target 與 Oracle 元件都動態連結它，
          # 而它不是 Windows 內建。沒有這幾支，乾淨的 Windows 連 db-kit.exe 都打不開
          # （安裝版不需要：NSIS / MSI 會處理，這裡只為「解壓即用」）。
          crt=$(ls -d "/c/Program Files/Microsoft Visual Studio/2022/"*/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT 2> /dev/null | tail -1)
          test -n "$crt"
          cp "$crt/vcruntime140.dll" "$crt/vcruntime140_1.dll" "$crt/msvcp140.dll" "$pkg/"
          # 輔助程式在 zip 裡不帶 target triple：bridge_path() 找的是不帶後綴的檔名。
          cp "src-tauri/binaries/dbk-rustdesk-bridge-$triple.exe" "$pkg/dbk-rustdesk-bridge.exe"
          cp LICENSE "$pkg/LICENSE"
          # 說明檔要給 Windows 記事本看：轉 CRLF。
          for f in portable.txt README-portable.txt ORACLE-NOTICE.txt; do
            sed 's/$/\r/' "packaging/portable/$f" > "$pkg/$f"
          done
          unzip -q instantclient.zip -d instantclient
          mv instantclient/instantclient_*/* "$pkg/oracle/"
          # 執行時用不到，拿掉省約 48 MB：除錯符號與 Java 驅動程式（其餘檔案不改，見 ORACLE-NOTICE.txt）。
          rm -f "$pkg"/oracle/*.sym "$pkg"/oracle/*.jar
          # 哨兵：client 沒攤平成功就讓這步失敗，而不是出一包連不上 Oracle 的 zip。
          test -f "$pkg/oracle/oci.dll"
          test -f "$pkg/oracle/BASIC_LICENSE"
          # -mx=5：內容以已經壓過的 Oracle DLL 為主，-mx=9 只省幾 MB 卻多花好幾分鐘。
          7z a -tzip -mx=5 "$pkg.zip" "$pkg" > /dev/null
          echo "PORTABLE_ZIP=$pkg.zip" >> "$GITHUB_ENV"
          ls -l "$pkg.zip"

      # tauri-action 已經建好 / 更新了這個 tag 的 Release，這裡只追加一個檔案。
      - name: Attach portable zip to release
        if: ${{ matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$PORTABLE_ZIP" --clobber

      - name: Upload manually built installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: db-kit-${{ matrix.label }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.rpm
            src-tauri/target/**/bundle/**/*.AppImage
            db-kit_*_x64_portable.zip
